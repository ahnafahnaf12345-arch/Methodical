<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Methodical</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap">
<style>
:root{--bg:#000000;--text:#f2f2f2;--muted:#9a9a9a;--accent:#ffd60a;--btn:#111;--glass:rgba(255,255,255,.1);--gborder:rgba(255,255,255,.3)}
[data-theme=light]{--bg:#fff6d9;--text:#4a3510;--muted:#7a5f2a;--accent:#c86f00;--btn:#fff;--glass:rgba(255,255,255,.55);--gborder:rgba(255,255,255,.9)}
[data-theme=grey]{--bg:#6b6f76;--text:#fff;--muted:#e0e0e0;--accent:#e53935;--btn:#fff;--glass:rgba(255,255,255,.14)}
[data-theme=red]{--bg:#3b0006;--text:#fff;--muted:#ffe0e0;--accent:#fff;--btn:#c4161c;--glass:rgba(255,255,255,.14);--gborder:rgba(255,255,255,.5)}
[data-theme=blood]{--bg:#0b0b0c;--text:#f2f2f2;--muted:#a8a8ad;--accent:#d61f1f;--btn:#ffffff;--glass:rgba(255,255,255,.06);--gborder:rgba(255,255,255,.22)}
[data-theme=green]{--bg:#03200d;--text:#e8ffe9;--muted:#8fbf99;--accent:#39ff6e;--btn:#03200d;--glass:rgba(255,255,255,.1)}
[data-theme=blue]{--bg:#0a2a7a;--text:#fff;--muted:#ffd0d0;--accent:#e53935;--btn:#fff;--glass:rgba(255,255,255,.12)}
[data-theme=darkblue]{--bg:#0a1640;--text:#fff6dc;--muted:#e8d9a8;--accent:#f5c451;--btn:#1a1200;--glass:rgba(255,255,255,.1)}
[data-theme=galaxy]{--bg:#03040b;--text:#eeeaff;--muted:#b8b0e0;--accent:#b39dff;--btn:#1a1200;--glass:rgba(255,255,255,.07)}
[data-theme=car]{--bg:#1c1c1f;--text:#fff;--muted:#aaa;--accent:#e31937;--btn:#fff;--glass:rgba(255,255,255,.1)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{position:relative;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);transition:background .4s}
@keyframes spin{to{transform:rotate(360deg)}}
.fx{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:14px 14px 96px}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:12px}
.pomo{padding:8px 10px;width:max-content;font-family:'Redaction 50',Georgia,serif}
.pomo *{font-family:'Redaction 50',Georgia,serif}
.pomo .t{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.pomo .m{font-size:.75rem;color:var(--muted)}
.title{margin:0;text-align:center;font-family:'Tiny5 Duo','Tiny5',monospace;font-size:3.6rem;font-weight:400;color:var(--text)}
.themebox{justify-self:end;font-family:'Tiny5 Duo','Tiny5',monospace;font-size:1.3rem;color:var(--muted);display:flex;gap:6px;align-items:center}
#themeSel{font-size:1.15rem;padding:8px 12px}
select.themeSel,#themeSel{font-family:'Tiny5 Duo','Tiny5',monospace}
select,input,button{font:inherit;color:var(--text)}
select,input{background:rgba(0,0,0,.2);border:1px solid var(--gborder);border-radius:8px;padding:8px 10px;color:inherit}
select{background:rgba(12,12,16,.92);color:#f5f5f5;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
select option{background:#15151b;color:#f5f5f5}
select option:checked,select option:hover{background:#2a2a33;color:#ffd60a}
button{cursor:pointer;background:var(--accent);color:var(--btn);border:none;border-radius:8px;padding:8px 12px;font-weight:600}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--gborder)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;font-family:'Black Ops One',sans-serif;letter-spacing:1px}
.tabs button:not(.active){background:var(--glass);color:var(--text);border:1px solid var(--gborder)}
h2{font-family:'Tiny5 Duo','Tiny5',monospace;font-size:1.5rem;letter-spacing:1px;margin:18px 0 8px;color:var(--accent)}
.glass{color:#f5f5f5;background:linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.62)),var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--gborder);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 20px rgba(0,0,0,.2)}
.card{padding:12px;margin-bottom:10px}
.glass .sub{color:#c4cdd6}
.glass .del{color:#c4cdd6}
.chead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap}
.sub{font-size:.8rem;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-top:1px solid var(--gborder)}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.tm{font-size:.8rem;color:var(--accent);font-weight:700;white-space:nowrap}
.mk{width:34px;height:34px;padding:0;background:rgba(0,0,0,.15);color:#f5f5f5;border:1px solid var(--gborder);font-size:1rem}
.mk.on-v{background:#2ecc71;color:#fff;border-color:#2ecc71}
.mk.on-x{background:#e74c3c;color:#fff;border-color:#e74c3c}
.del{background:transparent;color:var(--muted);padding:4px 6px}
.add{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.add input{flex:1 1 130px;min-width:0}
.add input[type=time]{flex:0 0 120px}
.note{font-size:.85rem;color:var(--muted);margin:14px 2px}
.quote{text-align:center;font-family:'Bebas Neue',Impact,sans-serif;font-style:normal;font-size:1.5rem;letter-spacing:1px;color:var(--muted);margin:22px 8px 6px;min-height:2.4em}
.hidden{display:none}
[data-theme=grey] .glass.ry0{border-color:#ff3b30;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 14px rgba(255,59,48,.45)}
[data-theme=grey] .glass.ry1{border-color:#ffd60a;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 14px rgba(255,214,10,.45)}
/* light: realistic sea */
.fx-sea{background:linear-gradient(#8fdcff 0%,#3ab2ee 30%,#1479bd 65%,#063a6e 100%)}
.fx-sea .sun{position:absolute;top:7%;right:12%;width:90px;height:90px;border-radius:50%;background:radial-gradient(#fffbe6,#ffe27a 45%,transparent 70%);box-shadow:0 0 90px 30px rgba(255,240,170,.5)}
.fx-sea .wave{position:absolute;left:0;right:0;height:90px;background-repeat:repeat-x;background-size:300px 90px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 60' preserveAspectRatio='none'><path d='M0 30 Q75 0 150 30 T300 30 V60 H0Z' fill='white' fill-opacity='.35'/></svg>");animation:drift 6s linear infinite}
.fx-sea .w1{bottom:60px;opacity:.5;animation-duration:7s}
.fx-sea .w2{bottom:30px;opacity:.35;animation-duration:10s;animation-direction:reverse}
.fx-sea .w3{bottom:0;opacity:.6;animation-duration:5s}
.fx-sea .glint{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 2px,transparent 2px 40px);animation:shimmer 3s ease-in-out infinite alternate}
@keyframes drift{from{background-position:0 0}to{background-position:300px 0}}
@keyframes shimmer{from{opacity:.3}to{opacity:.9}}
.fx-ocean .w{position:absolute;left:0;width:200%;height:160px;bottom:0;background:radial-gradient(circle at 50% 100%,#5bbcf0 45%,transparent 46%) 0 0/80px 60px repeat-x;animation:swim 5s linear infinite;opacity:.8}
.fx-ocean .w.b{bottom:30px;opacity:.45;animation-duration:8s;background-color:transparent}
@keyframes swim{to{transform:translateX(-80px)}}
/* dark: black hole */
.fx-bh{background:#000}
.fx-bh .halo{position:absolute;top:40%;left:50%;width:120vmin;height:120vmin;margin:-60vmin 0 0 -60vmin;border-radius:50%;background:none;animation:pulse 4s ease-in-out infinite}
.fx-bh .disk{position:absolute;top:40%;left:50%;width:80vmin;height:80vmin;margin:-40vmin 0 0 -40vmin;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 10%,rgba(255,170,60,.9) 15%,rgba(255,255,255,.9) 20%,transparent 26%,rgba(255,120,40,.8) 40%,transparent 48%,rgba(255,200,120,.9) 60%,transparent 70%);-webkit-mask-image:radial-gradient(circle,transparent 17vmin,#000 19vmin,#000 40vmin,transparent 41vmin);mask-image:radial-gradient(circle,transparent 17vmin,#000 19vmin,#000 40vmin,transparent 41vmin);animation:spin 6s linear infinite}
.fx-bh .hole{position:absolute;top:40%;left:50%;width:34vmin;height:34vmin;margin:-17vmin 0 0 -17vmin;border-radius:50%;background:#000;box-shadow:0 0 60px 20px #000,0 0 120px 40px rgba(120,60,255,.4)}
.fx-bh .p{position:absolute;top:40%;left:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#ffd98a;box-shadow:0 0 6px #ffb347;animation:suck linear infinite}
@keyframes suck{0%{transform:translate(var(--x),var(--y)) scale(1);opacity:0}10%{opacity:1}100%{transform:translate(0,0) scale(.2);opacity:0}}
.fx-bat .spot{position:absolute;top:-30%;left:50%;width:90vmax;height:90vmax;margin-left:-45vmax;background:radial-gradient(circle,rgba(255,214,10,.2),transparent 55%);animation:sweep 10s ease-in-out infinite alternate}
.fx-bat .bat{position:absolute;bottom:10px;right:10px;font-size:14rem;opacity:.07}
@keyframes sweep{from{transform:translateX(-20vw)}to{transform:translateX(20vw)}}
/* grey: ironman */
.fx-iron .core{position:absolute;top:22%;left:50%;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:radial-gradient(circle,#ffe56b 0%,#e53935 35%,transparent 70%);animation:pulse 2.4s ease-in-out infinite}
.fx-iron .ring{position:absolute;top:22%;left:50%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;border:3px dashed rgba(255,214,10,.4);animation:spin 20s linear infinite}
@keyframes pulse{50%{transform:scale(1.2);opacity:.6}}
/* red: dark red vibe */
.fx-spider{background:radial-gradient(circle at 50% 30%,#7a0010,#2a0004 60%,#110002)}
.fx-spider .web{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.12) 0 2deg,transparent 2deg 15deg);animation:spin 60s linear infinite}
.fx-spider .wave{position:absolute;left:-10%;width:120%;height:220px;bottom:-90px;border-radius:50%;background:rgba(255,255,255,.2);animation:breathe 4s ease-in-out infinite}
.fx-spider .w2{bottom:-120px;animation-duration:6s;opacity:.6}
@keyframes breathe{50%{transform:translateY(-50px)}}
/* bloody red */
.fx-blood .drop{position:absolute;top:-30px;width:3px;height:22px;background:linear-gradient(#ff2a2a,#6b0000);border-radius:0 0 3px 3px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
/* green goblin */
.fx-gob .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(80,255,120,.3),transparent 60%);animation:flicker 6s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
/* blue: captain america */
.fx-cap .shield{position:absolute;top:30%;left:50%;width:70vmin;height:70vmin;margin:-35vmin 0 0 -35vmin;border-radius:50%;background:repeating-radial-gradient(circle,#c1272d 0 12%,#fff 12% 24%,#1f4fd8 24% 36%);opacity:.25;animation:pulse 5s ease-in-out infinite}
.fx-cap .star{position:absolute;top:30%;left:50%;font-size:6rem;margin:-3rem 0 0 -3rem;opacity:.3}
/* dark-blue: thor */
.fx-thor .flash{position:absolute;inset:0;background:rgba(180,220,255,.5);animation:flash 6s infinite;opacity:0}
.fx-thor .bolt{position:absolute;top:8%;left:70%;font-size:12rem;opacity:.12}
@keyframes flash{0%,92%,100%{opacity:0}94%{opacity:.8}96%{opacity:.1}98%{opacity:.6}}
/* galaxy */
.fx-gal .stars{position:absolute;inset:0;background:radial-gradient(#fff 1px,transparent 1px) 0 0/50px 50px;opacity:.35}
.fx-gal .sun{position:absolute;top:50%;left:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:radial-gradient(#fff3a0,#ffb300);box-shadow:0 0 60px #ffb300}
.fx-gal .orbit{position:absolute;top:50%;left:50%;border:1px dashed rgba(255,255,255,.18);border-radius:50%;animation:spin linear infinite}
.fx-gal .planet{position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%}
.fx-gal .earth{width:20px;height:20px;top:-10px;margin-left:-10px;box-shadow:0 0 14px #b39dff}
/* car */
.fx-car .road{position:absolute;bottom:0;left:0;right:0;height:90px;background:#2b2b2e}
.fx-car .dash{position:absolute;bottom:42px;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,#f5f5f5 0 40px,transparent 40px 90px);animation:road 1s linear infinite}
.fx-car .car{position:absolute;bottom:30px;left:0;font-size:70px;animation:drive 9s linear infinite}
.fx-car .tlabel{font-size:14px;font-weight:700;letter-spacing:2px;vertical-align:middle}
@keyframes road{to{transform:translateX(90px)}}
@keyframes drive{from{transform:translateX(-200px)}to{transform:translateX(calc(100vw + 200px))}}
/* earthquake (dark-blue) */
.fx-quake{background:linear-gradient(#0b1733,#050b1c);animation:shake .12s infinite linear}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-2px)}100%{transform:translate(0,0)}}
.fx-quake .ground{position:absolute;bottom:0;left:0;right:0;height:22vh;background:linear-gradient(#24324f,#0d1528);box-shadow:0 -4px 20px rgba(0,0,0,.6)}
.fx-quake .crack{position:absolute;height:3px;background:#ffb74d;box-shadow:0 0 10px #ff8a00;animation:glowc .8s steps(2) infinite}
@keyframes glowc{50%{opacity:.25}}
.fx-quake .dust{position:absolute;bottom:20vh;width:5px;height:5px;border-radius:50%;background:rgba(200,190,170,.6);animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:0}20%{opacity:.8}to{transform:translateY(-70vh);opacity:0}}
.fx-quake .ringq{position:absolute;top:70%;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid rgba(120,180,255,.6);animation:quakeRing 3s ease-out infinite}
.fx-quake .r2{animation-delay:1s}.fx-quake .r3{animation-delay:2s}
@keyframes quakeRing{to{transform:scale(60);opacity:0}}
/* car racing */
.fx-race{background:linear-gradient(#0a0d18,#1a1f30 55%,#262b3a)}
.fx-race .track{position:absolute;left:-30%;right:-30%;bottom:0;height:70vh;transform:perspective(500px) rotateX(58deg);transform-origin:50% 100%;background-color:#2a2a2e;background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.85) 0 12px,transparent 12px 90px),linear-gradient(90deg,transparent 0 33%,rgba(255,255,255,.5) 33% calc(33% + 3px),transparent calc(33% + 3px) 66%,rgba(255,255,255,.5) 66% calc(66% + 3px),transparent calc(66% + 3px));animation:rush .35s linear infinite}
@keyframes rush{to{background-position:0 90px,0 0}}
.fx-race .racer{position:absolute;left:0;line-height:1;animation:zoom linear infinite}
.fx-race .c1{font-size:72px;bottom:14vh;animation-duration:1.4s}
.fx-race .c2{font-size:56px;bottom:24vh;animation-duration:2s;animation-delay:-.8s}
.fx-race .c3{font-size:64px;bottom:9vh;animation-duration:1.1s;animation-delay:-.3s}
@keyframes zoom{from{transform:translateX(-150px)}to{transform:translateX(calc(100vw + 150px))}}
.fx-race .streak{position:absolute;left:-300px;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);animation:streakRun linear infinite}
@keyframes streakRun{to{transform:translateX(calc(100vw + 400px))}}
/* forest */
.fx-forest{background:linear-gradient(#050a07,#0c1d13 60%,#06110a)}
.fx-forest .fog{position:absolute;bottom:0;left:-50%;width:200%;height:45vh;background:radial-gradient(ellipse at 50% 100%,rgba(190,230,205,.16),transparent 70%);animation:fogDrift 18s ease-in-out infinite alternate}
@keyframes fogDrift{to{transform:translateX(10%)}}
.fx-forest .tree{position:absolute;bottom:-4vh;line-height:1;filter:brightness(.35) saturate(.6);transform-origin:50% 100%;animation:sway ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.fx-forest .wind{position:absolute;left:-300px;height:2px;background:linear-gradient(90deg,transparent,rgba(220,255,230,.5),transparent);animation:gust linear infinite}
@keyframes gust{to{transform:translateX(calc(100vw + 400px))}}
.fx-forest .leaf{position:absolute;left:-40px;opacity:.7;filter:brightness(.6);animation:leafFly linear infinite}
@keyframes leafFly{from{transform:translate(0,0) rotate(0)}to{transform:translate(calc(100vw + 80px),40px) rotate(720deg)}}
/* blue sky */
.fx-sky{background:linear-gradient(#1565d8 0%,#4aa3f0 50%,#bfe6ff 100%)}
.fx-sky .sun{position:absolute;top:8%;left:10%;width:100px;height:100px;border-radius:50%;background:radial-gradient(#fffdf0,#ffe98a 50%,transparent 70%);box-shadow:0 0 100px 40px rgba(255,240,180,.5)}
.fx-sky .cloud{position:absolute;left:0;height:50px;background:#fff;border-radius:50px;filter:blur(2px);opacity:.92;animation:cloudRun linear infinite}
.fx-sky .cloud::before{content:'';position:absolute;width:90px;height:90px;background:#fff;border-radius:50%;left:25px;top:-40px}
.fx-sky .cloud::after{content:'';position:absolute;width:70px;height:70px;background:#fff;border-radius:50%;left:90px;top:-28px}
@keyframes cloudRun{from{transform:translateX(-320px)}to{transform:translateX(calc(100vw + 320px))}}
/* next-page button (bottom right) */
.nextbtn{position:fixed;left:18px;bottom:18px;z-index:5;border-radius:999px;padding:12px 20px;box-shadow:0 6px 18px rgba(0,0,0,.35);font-size:.95rem}
.leftgroup{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.musicbox{padding:8px 10px;width:250px;max-width:100%}
.musicbox .add input{flex:1 1 120px;min-width:0;font-size:.85rem}
.musicbox .m{font-size:.75rem;color:var(--muted)}
[data-theme=pennywise]{--bg:#070000;--text:#f5eeee;--muted:#c9a9a9;--accent:#e10600;--btn:#fff;--glass:rgba(0,0,0,.4);--gborder:rgba(255,40,40,.35)}
/* pennywise: horror balloons */
.fx-pw{background:radial-gradient(circle at 50% 110%,#3a0000,#0a0000 60%,#000)}
.fx-pw .balloon{position:absolute;bottom:-90px;font-size:46px;filter:drop-shadow(0 0 10px #ff0000);animation:floatUp linear infinite}
@keyframes floatUp{to{transform:translateY(-125vh) rotate(12deg)}}
.fx-pw .eye{position:absolute;top:44%;width:16px;height:10px;border-radius:50%;background:#ffd23f;box-shadow:0 0 22px #ffb300;animation:blink 6s infinite}
@keyframes blink{0%,90%,100%{opacity:1}94%{opacity:0}}

[data-theme=it] .glass{color:#f2eaea;background:linear-gradient(rgba(0,0,0,.9),rgba(0,0,0,.9)),#000;border-color:rgba(190,0,0,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 18px rgba(170,0,0,.4)}

/* phone layout: title on top, Pomodoro on the left, Themes on the right */
@media (max-width:600px){
  .top{grid-template-columns:1fr 1fr;gap:8px}
  .title{grid-column:1 / -1;grid-row:1;font-size:2.8rem}
  .leftgroup{grid-column:1;grid-row:2}
  .themebox{grid-column:2;grid-row:2;justify-self:end;flex-direction:column;align-items:flex-end;gap:4px}
  .themebox select{max-width:140px;width:100%}
  .pomo{width:auto}
  .pomo .t{font-size:1.2rem}
}
/* Main tasks box font */
.mainbox, .mainbox *{font-family:'Tiny5 Duo','Tiny5',monospace !important}
/* smaller Time basis box */
.smallbox{padding:6px 10px}
.smallbox .chead b{font-size:.9rem}
.smallbox .row{padding:2px 2px;gap:6px}
.smallbox .mk{width:28px;height:28px;font-size:.85rem}
.smallbox .add{margin-top:4px}
.smallbox .tlab{flex-direction:row !important;align-items:center;padding:2px 6px !important;gap:4px !important}
.smallbox .chead{margin-bottom:0}
.smallbox{padding:14px 12px}
.smallbox .row{padding:9px 4px}
.smallbox .mk{width:34px;height:34px;font-size:.95rem}
.smallbox .add{margin-top:12px}
.smallbox .add input{padding:9px 10px}
.smallbox .add input{padding:6px 8px;font-size:.85rem}
.tp{display:inline-flex;align-items:center;gap:3px;font-size:.8rem;flex-wrap:wrap}
.tp small{color:var(--muted)}
.tp select{padding:3px 2px;font-size:.8rem;width:auto}
.cdwrap{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;max-width:100%}
/* tidy layout: Pomodoro top-left, title centre, Themes right, countdowns in a neat grid below */
.leftgroup{display:contents}
.pomo{grid-column:1;grid-row:1}
.title{grid-column:2;grid-row:1}
.themebox{grid-column:3;grid-row:1}

/* dark-blue: falling mist */

.fx-mist .mist{position:absolute;top:-30%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(190,215,255,.55) 0%,rgba(150,185,235,.25) 45%,transparent 72%);filter:blur(10px);animation-name:mistFall;animation-timing-function:linear;animation-iteration-count:infinite}

/* blue: cloudy dark sky with birds */

.fx-sky2 .cloud::before{content:'';position:absolute;width:90px;height:90px;background:#e6ecf5;border-radius:50%;left:25px;top:-40px}
.fx-sky2 .cloud::after{content:'';position:absolute;width:70px;height:70px;background:#dbe3ef;border-radius:50%;left:95px;top:-28px}
.fx-sky2 .bird{position:absolute;left:-40px;animation:fly linear infinite}
.fx-sky2 .bird svg{display:block;animation:flap .5s ease-in-out infinite alternate;transform-origin:center}
@keyframes flap{to{transform:scaleY(.45)}}

<script>
const KEY = 'methodicalV2';
const LABEL = {daily:'today', weekly:'this week', monthly:'this month'};
const THEMES = [['light','Light'],['dark','Dark'],['grey','Forest'],['red','Dark-red'],['blood','Psycho'],['green','Green'],['blue','Blue'],['darkblue','Dark-blue'],['galaxy','Galaxy'],['pennywise','Pennywise']];
const LISTS = {
  d_main:{title:'Main tasks',period:'daily'},
  d_time:{title:'Time basis',period:'daily',time:true},
  d_bonus:{title:'Bonus prayer',period:'daily'},
  d_ex:{title:'Workout Tracking',period:'daily'},
  d_skill:{title:'Skill Tracking',period:'daily'},
  d_extra:{title:'Other works',period:'daily',time:true},
  d_distract:{title:'Distraction time',period:'daily',time:true},
  w_study:{title:'Study tasks',period:'weekly'},
  w_skill:{title:'Skills',period:'weekly'},
  w_ex:{title:'Exercise & workout',period:'weekly'},
  m_skill:{title:'Skills (complete / not yet)',period:'monthly'},
  m_study:{title:'Study tasks',period:'monthly',carry:true}
};
const PRAYERS = ['Fajr','Zuhr','Asr','Maghrib','Isha'];
const QUOTES = [
  "Lost time is never found again. – Benjamin Franklin",
  "Focus on being productive instead of busy. – Tim Ferriss",
  "The key is not to prioritize what's on your schedule, but to schedule your priorities. – Stephen Covey",
  "A goal without a plan is just a wish. – Antoine de Saint-Exupéry",
  "Plan your work and work your plan.",
  "Small steps every day beat big plans never started.",
  "Time is what we want most, but what we use worst. – William Penn",
  "Do the hardest task first, while your mind is fresh.",
  "You do not find the happy life. You make it, one routine at a time."
];
let S = load();
let tab = 'routines';

function load(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  s = s || {};
  s.theme = s.theme || 'dark';
  s.lists = s.lists || {};
  s.prayers = s.prayers || {};
  for(const id in LISTS) s.lists[id] = s.lists[id] || {items:[]};
  if(!s.lists.d_bonus.items.length){
    s.lists.d_bonus.items = [
      {id:uid(), name:'Tahajjud', created:'', st:{}},
      {id:uid(), name:'Tasbih', created:'', st:{}}
    ];
  }
  return s;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// daily=YYYY-MM-DD, weekly=ISO week, monthly=YYYY-MM
function keyFor(p, d = new Date()){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  if(p==='daily') return `${y}-${m}-${day}`;
  if(p==='monthly') return `${y}-${m}`;
  const t = new Date(Date.UTC(y, d.getMonth(), d.getDate()));
  const dn = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dn);
  const ys = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const w = Math.ceil(((t - ys) / 86400000 + 1) / 7);
  return `${t.getUTCFullYear()}-W${String(w).padStart(2,'0')}`;
}

// ---- Themes and effects ----
function drops(n){
  let h = '';
  for(let i=0;i<n;i++) h += `<i class="drop" style="left:${(Math.random()*100).toFixed(1)}%;animation-duration:${(2+Math.random()*3).toFixed(2)}s;animation-delay:${(-Math.random()*5).toFixed(2)}s"></i>`;
  return h;
}
function orbit(size, dur, color, earth){
  return `<div class="orbit" style="width:${size}px;height:${size}px;margin:-${size/2}px 0 0 -${size/2}px;animation-duration:${dur}s"><div class="planet${earth?' earth':''}" style="background:${color}"></div></div>`;
}
function rnd(a,b){ return a + Math.random()*(b-a); }
function quakeHTML(){
  let dust = '', cracks = '';
  for(let i=0;i<40;i++) dust += `<i class='dust' style='left:${rnd(0,100).toFixed(1)}%;animation-duration:${rnd(4,8).toFixed(1)}s;animation-delay:${(-rnd(0,8)).toFixed(1)}s'></i>`;
  for(let i=0;i<6;i++) cracks += `<i class='crack' style='left:${rnd(5,80).toFixed(0)}%;bottom:${rnd(8,30).toFixed(0)}vh;width:${rnd(80,220).toFixed(0)}px;transform:rotate(${rnd(-25,25).toFixed(0)}deg)'></i>`;
  return `<div class='fx fx-quake'><div class='ringq'></div><div class='ringq r2'></div><div class='ringq r3'></div><div class='ground'></div>${cracks}${dust}</div>`;
}
function forestHTML(){
  let trees = '', gusts = '', leaves = '';
  for(let i=0;i<14;i++) trees += `<div class='tree' style='left:${(i*7.5-3+rnd(-2,2)).toFixed(1)}%;font-size:${rnd(60,120).toFixed(0)}px;animation-duration:${rnd(3,6).toFixed(1)}s;animation-delay:${(-rnd(0,5)).toFixed(1)}s'>🌲</div>`;
  for(let i=0;i<18;i++) gusts += `<i class='wind' style='top:${rnd(5,90).toFixed(0)}%;width:${rnd(80,240).toFixed(0)}px;animation-duration:${rnd(1.5,3.5).toFixed(1)}s;animation-delay:${(-rnd(0,3)).toFixed(1)}s'></i>`;
  for(let i=0;i<12;i++) leaves += `<span class='leaf' style='top:${rnd(0,80).toFixed(0)}%;animation-duration:${rnd(4,8).toFixed(1)}s;animation-delay:${(-rnd(0,8)).toFixed(1)}s'>🍃</span>`;
  return `<div class='fx fx-forest'><div class='fog'></div>${gusts}${leaves}${trees}</div>`;
}
function bhHTML(){
  let p = '';
  for(let i=0;i<40;i++){
    const a = Math.random()*Math.PI*2, d = 35 + Math.random()*25;
    p += `<i class="p" style="--x:${(Math.cos(a)*d).toFixed(1)}vmin;--y:${(Math.sin(a)*d).toFixed(1)}vmin;animation-duration:${(4+Math.random()*4).toFixed(2)}s;animation-delay:${(-Math.random()*8).toFixed(2)}s"></i>`;
  }
  return '<div class="fx fx-bh"><div class="halo"></div><div class="disk"></div><div class="hole"></div>' + p + '</div>';
}
const FX = {
  light:'<div class="fx fx-sea"><div class="sun"></div><div class="wave w1"></div><div class="wave w2"></div><div class="wave w3"></div><div class="glint"></div></div>',
  dark: bhHTML(),
  grey:'<div class="fx fx-iron"><div class="ring"></div><div class="core"></div></div>',
  red:'<div class="fx fx-spider"><div class="web"></div><div class="wave"></div><div class="wave w2"></div></div>',
  blood:'<div class="fx fx-blood">'+drops(60)+'</div>',
  green:'<div class="fx fx-gob"><div class="glow"></div></div>',
  blue:'<div class="fx fx-cap"><div class="shield"></div><div class="star">★</div></div>',
  darkblue:'<div class="fx fx-thor"><div class="flash"></div><div class="bolt">⚡</div></div>',
  galaxy:'<div class="fx fx-gal"><div class="stars"></div><div class="sun"></div>'+orbit(160,6,'#b8b8b8')+orbit(230,9,'#e0b07a')+orbit(300,14,'#b39dff',true)+orbit(380,20,'#e0574f')+'</div>',
  car:'<div class="fx fx-car"><div class="road"></div><div class="dash"></div><div class="car">🚗<span class="tlabel">TESLA</span></div></div>'
};

function setTheme(t){
  S.theme = t;
  document.body.dataset.theme = t;
  document.getElementById('themeSel').value = t;
  document.getElementById('fx').innerHTML = FX[t] || '';
  save(); renderApp();
}

// ---- Tabs ----
function showTab(t){
  tab = t;
  document.getElementById('tabR').classList.toggle('active', t==='routines');
  document.getElementById('tabH').classList.toggle('active', t==='history');
  renderApp();
}
function renderApp(){ document.getElementById('app').innerHTML = tab==='routines' ? routinesHTML() : historyHTML(); }

// ---- Lists ----
function listCard(id, extra=''){
  const L = LISTS[id], k = keyFor(L.period);
  const all = S.lists[id].items;
  const items = L.carry ? all.filter(i => i.created===k || i.st[k]!=='v') : all;
  const done = items.filter(i => i.st[k]==='v').length;
  let h = `<div class="card glass ry${Object.keys(LISTS).indexOf(id)%2}${['d_main','d_time','d_bonus'].includes(id)?' mainbox':''}${id==='d_time'?' smallbox':''}"><div class="chead"><b>${L.title}</b><span class="sub">${done}/${items.length} done ${LABEL[L.period]}</span></div>`;
  if(L.carry && items.some(i => i.created && i.created<k)) h += `<div class="sub">Previous (not complete) are carried over</div>`;
  for(const i of items){
    const st = i.st[k] || '';
    const carried = i.created && i.created < k;
    h += `<div class="row">
      ${L.time && i.time ? `<span class="tm">${esc(i.time)}</span>` : ''}
      <span class="grow">${esc(i.name)}${carried ? ' <span class="sub">(carried over)</span>' : ''}</span>
      <button class="mk ${st==='v'?'on-v':''}" onclick="mark('${id}','${i.id}','v')" aria-label="Complete">✓</button>
      <button class="mk ${st==='x'?'on-x':''}" onclick="mark('${id}','${i.id}','x')" aria-label="Not complete">✗</button>
      <button class="del" onclick="delItem('${id}','${i.id}')" aria-label="Delete">✕</button>
    </div>`;
  }
  h += `<div class="add"><input id="n_${id}" placeholder="Add ${L.title.toLowerCase()}">${L.time ? `<label class='tlab' style='font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;gap:2px;border:1px solid var(--gborder);border-radius:8px;padding:4px 6px'>Start<input id="t_${id}" type="time" style='padding:4px 6px'></label><label class='tlab' style='font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;gap:2px;border:1px solid var(--gborder);border-radius:8px;padding:4px 6px'>End<input id="e_${id}" type="time" style='padding:4px 6px'></label>` : ''}<button onclick="addItem('${id}')">+ Add</button></div>`;
  return h + `</div>`;
}
function addItem(id){
  const n = document.getElementById('n_'+id);
  const name = n.value.trim(); if(!name) return;
  const t = document.getElementById('t_'+id), e = document.getElementById('e_'+id);
  S.lists[id].items.push({id:uid(), name, time: t ? (t.value && e && e.value ? t.value + ' to ' + e.value : (t.value || '')) : '', created: keyFor(LISTS[id].period), st:{}});
  save(); renderApp();
}
function mark(id, iid, v){
  const k = keyFor(LISTS[id].period);
  const it = S.lists[id].items.find(x => x.id===iid); if(!it) return;
  if(it.st[k]===v) delete it.st[k]; else it.st[k] = v;
  save(); renderApp();
}
function delItem(id, iid){ S.lists[id].items = S.lists[id].items.filter(x => x.id!==iid); save(); renderApp(); }

// ---- Prayer ----
function prayerCard(){
  const k = keyFor('daily');
  const day = S.prayers[k] || {};
  let h = `<div class="card glass ry0 mainbox"><div class="chead"><b>Namaz & prayer</b><span class="sub">tap to select</span></div>`;
  for(const p of PRAYERS){
    const st = day[p] || '';
    h += `<div class="row"><span class="grow">${p}</span>
      <button class="mk ${st==='v'?'on-v':''}" onclick="setPrayer('${p}','v')">✓</button>
      <button class="mk ${st==='x'?'on-x':''}" onclick="setPrayer('${p}','x')">✗</button></div>`;
  }
  const allDone = PRAYERS.every(p => (day[p] || '') === 'v');
  if(allDone) h += `<div class='glass' style='padding:12px 14px;margin:10px 0 0;font-family:"Redaction 50",Georgia,serif;font-size:1.2rem;line-height:1.4;color:var(--accent);text-align:center'>Mashallah, brother. Keep it, &amp; Inshallah ALLAH will help you in every step of your life.</div>`;
  return h + `</div>` + listCard('d_bonus');
}
function setPrayer(p, v){
  const k = keyFor('daily');
  S.prayers[k] = S.prayers[k] || {};
  S.prayers[k][p] = S.prayers[k][p] === v ? '' : v;
  save(); renderApp();
}

// ---- Views ----
let prayerOpen = false;
function togglePrayer(){ prayerOpen = !prayerOpen; renderApp(); }
function prayerTrackBox(){
  const k = keyFor('daily'), day = S.prayers[k] || {};
  const done = PRAYERS.filter(p => day[p] === 'v').length;
  let h = `<div class='card glass ry0 mainbox' style='cursor:pointer' onclick='togglePrayer()'><div class='chead'><b>Prayer Tracking</b><span class='sub'>${done}/5 prayers ${prayerOpen ? '▲' : '▼'}</span></div></div>`;
  if(prayerOpen) h += prayerCard();
  return h;
}
let openBoxes = {};
function toggleBox(id){ openBoxes[id] = !openBoxes[id]; renderApp(); }
function collapseBox(id){
  const L = LISTS[id], k = keyFor(L.period), items = S.lists[id].items;
  const done = items.filter(i => i.st[k] === 'v').length, open = !!openBoxes[id];
  let h = `<div class='card glass ry0 mainbox' style='cursor:pointer' onclick='toggleBox("${id}")'><div class='chead'><b>${L.title}</b><span class='sub'>${done}/${items.length} done ${open ? '▲' : '▼'}</span></div></div>`;
  if(open) h += listCard(id);
  return h;
}
let page = 'daily';
const PAGES = ['daily','weekly','monthly'];
function routinesHTML(){
  let h = '';
  if(page==='daily') h = `<h2>Daily · ${new Date().toLocaleDateString('en-US', {weekday:'long', day:'numeric', month:'long', year:'numeric'})}</h2>` + listCard('d_main') + timeBasisBox() + studyTimeBox() + collapseBox('d_extra') + distractBox() + sleepCollapsible() + prayerTrackBox() + collapseBox('d_ex') + collapseBox('d_skill');
  else if(page==='weekly') h = `<h2>Weekly</h2>` + listCard('w_study') + listCard('w_skill') + listCard('w_ex');

  h += `<div class='note'>Page ${idx+1} of 3</div>`;

}
function goPage(p){ page = p; window.scrollTo(0,0); renderApp(); }
function routinesAllHTML(){
  return `<h2>Daily</h2>`
    + listCard('d_main') + listCard('d_time') + prayerCard() + listCard('d_ex') + listCard('d_skill')
    + `<h2>Weekly</h2>` + listCard('w_study') + listCard('w_skill') + listCard('w_ex')
    + `<h2>Monthly</h2>` + listCard('m_skill') + listCard('m_study')
    + `<div class="note">Every task has ✓ and ✗ so you can see whether it is complete.</div>`;
}
let hpage = 'daily';
function historyHTML(){
  const p = hpage, g = {};
  const add = (k, st) => { g[k] = g[k] || {v:0, x:0}; if(st==='v') g[k].v++; if(st==='x') g[k].x++; };
  for(const id in LISTS) if(LISTS[id].period===p) for(const it of S.lists[id].items) for(const k in it.st) add(k, it.st[k]);
  if(p==='daily') for(const k in S.prayers) for(const pr in S.prayers[k]) add(k, S.prayers[k][pr]);
  const keys = Object.keys(g).sort().reverse().slice(0, 30);
  const idx = PAGES.indexOf(p), nxt = PAGES[(idx+1)%3];
  let h = `<h2>${p[0].toUpperCase()+p.slice(1)} history</h2>`;
  if(!keys.length) h += `<div class='sub'>Nothing recorded yet.</div>`;
  for(const k of keys) h += `<div class='card glass row'><span class='grow'><b>${k}</b></span><span>&#10003; ${g[k].v}</span><span style='margin-left:12px'>&#10007; ${g[k].x}</span></div>`;
  h += `<div class='note'>Page ${idx+1} of 3</div>`;
  h += `<button class='nextbtn' onclick="goHist('${nxt}')" aria-label='Next page'>${nxt[0].toUpperCase()+nxt.slice(1)} &#8250;</button>`;
  return h;
}
function goHist(p){ hpage = p; window.scrollTo(0,0); renderApp(); }
function historyAllHTML(){
  const groups = {daily:{}, weekly:{}, monthly:{}};
  const add = (p, k, st) => {
    const g = groups[p]; g[k] = g[k] || {v:0, x:0};
    if(st==='v') g[k].v++; if(st==='x') g[k].x++;
  };
  for(const id in LISTS){
    const p = LISTS[id].period;
    for(const it of S.lists[id].items) for(const k in it.st) add(p, k, it.st[k]);
  }
  for(const k in S.prayers) for(const p in S.prayers[k]) add('daily', k, S.prayers[k][p]);
  let h = '';
  for(const p of ['daily','weekly','monthly']){
    const keys = Object.keys(groups[p]).sort().reverse().slice(0, 30);
    h += `<h2>${p[0].toUpperCase()+p.slice(1)} history</h2>`;
    if(!keys.length){ h += `<div class="empty sub">Nothing recorded yet.</div>`; continue; }
    for(const k of keys){
      const g = groups[p][k];
      h += `<div class="card glass row"><span class="grow"><b>${k}</b></span><span>✓ ${g.v}</span><span style="margin-left:12px">✗ ${g.x}</span></div>`;
    }
  }
  return h;
}

// ---- Pomodoro ----
let pomoMinutes = 25, pomoSec = 25*60, pomoOn = false, pomoTimer = null, pomoFocus = true;
function pomoRender(){
  const m = String(Math.floor(pomoSec/60)).padStart(2,'0'), s = String(pomoSec%60).padStart(2,'0');
  document.getElementById('pomoTime').textContent = `${m}:${s}`;
  document.getElementById('pomoMode').textContent = pomoFocus ? 'Focus' : 'Break';
  document.getElementById('pomoBtn').textContent = pomoOn ? 'Pause' : 'Start';
}
function pomoToggle(){
  pomoOn = !pomoOn;
  if(pomoOn){
    pomoTimer = setInterval(() => {
      if(pomoSec > 0) pomoSec--;
      else { playAlarm(); pomoFocus = !pomoFocus; pomoSec = (pomoFocus ? pomoMinutes : 5)*60; pomoOn = false; clearInterval(pomoTimer); }
      pomoRender();
    }, 1000);
  } else clearInterval(pomoTimer);
  pomoRender();
}
function playAlarm(){
  try{
    const C = new (window.AudioContext || window.webkitAudioContext)();
    const beep = (t) => {
      const o = C.createOscillator(), g = C.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      o.connect(g); g.connect(C.destination);
      g.gain.setValueAtTime(0.0001, C.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.4, C.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, C.currentTime + t + 0.5);
      o.start(C.currentTime + t); o.stop(C.currentTime + t + 0.55);
    };
    for(let i = 0; i < 6; i++) beep(i * 0.7);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]);
}
function setFocusMin(v){
  pomoMinutes = Math.max(1, Math.min(180, parseInt(v) || 25));
  if(!pomoOn){ pomoFocus = true; pomoSec = pomoMinutes*60; pomoRender(); }
}
function pomoReset(){ clearInterval(pomoTimer); pomoOn = false; pomoFocus = true; pomoSec = pomoMinutes*60; pomoRender(); }

function embedUrl(u){
  try{
    const x = new URL(u), parts = x.pathname.split('/').filter(Boolean);
    if(x.hostname.includes('spotify.com') && parts.length>=2 && ['track','playlist','album','episode','show'].includes(parts[0])) return 'https://open.spotify.com/embed/'+parts[0]+'/'+parts[1];
    if(x.hostname.includes('youtu.be')) return 'https://www.youtube-nocookie.com/embed/'+parts[0];
    if(x.hostname.includes('youtube.com')){
      if(x.searchParams.get('list')) return 'https://www.youtube-nocookie.com/embed/videoseries?list='+x.searchParams.get('list');
      if(x.searchParams.get('v')) return 'https://www.youtube-nocookie.com/embed/'+x.searchParams.get('v');
    }
  }catch(e){}
  return '';
}

let editing = null;
function to24(h, m, p){ let hh = parseInt(h, 10) % 12; if(p === 'PM') hh += 12; return hh*60 + parseInt(m, 10); }
function fmt12(min){ min = ((min % 1440) + 1440) % 1440; const h = Math.floor(min/60); return ((h % 12) || 12) + ':' + String(min % 60).padStart(2,'0') + ' ' + (h >= 12 ? 'PM' : 'AM'); }
function tparts(min){ min = ((min % 1440) + 1440) % 1440; const h = Math.floor(min/60); return {h: String((h % 12) || 12), m: String(min % 60).padStart(2,'0'), p: h >= 12 ? 'PM' : 'AM'}; }
function tpick(k, id, min){
  const v = tparts(min == null ? (k === 's' ? 540 : 600) : min);
  const H = [], M = [];
  for(let i = 1; i <= 12; i++) H.push(String(i));
  for(let i = 0; i < 60; i++) M.push(String(i).padStart(2,'0'));
  const sel = (arr, val) => arr.map(x => `<option${x === val ? ' selected' : ''}>${x}</option>`).join('');
  return `<span class='tp'><small>${k === 's' ? 'Start' : 'End'}</small><select id='${k}h_${id}'>${sel(H, v.h)}</select><select id='${k}m_${id}'>${sel(M, v.m)}</select><select id='${k}p_${id}'>${sel(['AM','PM'], v.p)}</select></span>`;
}

function playAlarm(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = window.__pomoCtx || (window.__pomoCtx = new AC());
    if(ctx.state === 'suspended') ctx.resume();
    const bell = function(t0){
      [[523.25, 1], [1046.5, 0.5], [1569.8, 0.25], [2093.0, 0.12]].forEach(function(p){
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = p[0];
        o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(p[1] * 0.5, t0 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.2);
        o.start(t0); o.stop(t0 + 2.3);
      });
    };
    const now = ctx.currentTime + 0.05;
    bell(now); bell(now + 1.4); bell(now + 2.8);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
}

  const m = new Uint8Array(1440);
  for(const it of list){

    const len = (it.end - it.start + 1440) % 1440;

  }
  return m;
}

function cutSegments(item, extra, slp){
  const len = (item.end - item.start + 1440) % 1440;
  const segs = [];
  let cur = null;
  for(let t = 0; t < len; t++){
    const abs = (item.start + t) % 1440;
    let owner = null;
    for(const e of extra){
      if(e.start == null || e.end == null) continue;
      const l = (e.end - e.start + 1440) % 1440;
      if((abs - e.start + 1440) % 1440 < l){ owner = 'Extra: ' + e.name; break; }
    }
    if(!owner && slp){
      const l = (slp.end - slp.start + 1440) % 1440;
      if((abs - slp.start + 1440) % 1440 < l) owner = 'Sleep';
    }
    if(owner){
      if(cur && cur.owner === owner && cur.to === abs){ cur.to = (abs + 1) % 1440; cur.mins++; }
      else { cur = {owner: owner, from: abs, to: (abs + 1) % 1440, mins: 1}; segs.push(cur); }
    } else cur = null;
  }
  return segs;
}

function freeSegs(item, segs){
  const len = (item.end - item.start + 1440) % 1440;
  const used = new Uint8Array(len);
  for(const s of segs){
    const off = (s.from - item.start + 1440) % 1440;
    for(let k = 0; k < s.mins; k++) used[(off + k) % 1440] = 1;
  }
  const out = [];
  let t = 0;
  while(t < len){
    if(used[t]){ t++; continue; }
    const t0 = t;
    while(t < len && !used[t]) t++;
    out.push({from: (item.start + t0) % 1440, to: (item.start + t) % 1440, mins: t - t0});
  }
  return out;
}

function fakeFull(on){
  document.body.classList.toggle('page-full', on);
  const b = document.getElementById('fsBtn');
  if(b) b.textContent = on ? 'Exit full screen' : 'Full screen';
}
function toggleFull(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  const inFull = document.fullscreenElement || document.webkitFullscreenElement;
  if(inFull){
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if(ex) ex.call(document);
    fakeFull(false);
    return;
  }
  if(req){
    let p;
    try { p = req.call(el); } catch(e){ p = null; }
    if(p && p.catch){ p.catch(function(){ fakeFull(!document.body.classList.contains('page-full')); }); }
    else if(!p){ fakeFull(!document.body.classList.contains('page-full')); }
    return;
  }
  fakeFull(!document.body.classList.contains('page-full'));
}

function toggleFull(){

  const inFull = document.fullscreenElement || document.webkitFullscreenElement;
  if(inFull){
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if(ex) try { ex.call(document); } catch(e){}
    fakeFull(false);
    return;
  }
  const wantOn = !document.body.classList.contains('page-full');
  if(!wantOn){ fakeFull(false); return; }
  let p = null;
  try { if(req) p = req.call(el); } catch(e){ p = null; }
  // If the browser refuses or silently ignores full screen (common on phones), use the full-screen style view instead

  }, 400);
  if(p && p.catch) p.catch(function(){ fakeFull(true); });
}

function cutSegments(item, extra, slp){
  // Other works, distraction time and sleep are all cut from study time
  const sources = [];
  for(const e of extra) if(e.start != null && e.end != null) sources.push({start: e.start, end: e.end, label: 'Other works: ' + e.name});
  if(S.lists.d_distract) for(const d of S.lists.d_distract.items) if(d.start != null && d.end != null) sources.push({start: d.start, end: d.end, label: 'Distraction: ' + d.name});
  if(slp) sources.push({start: slp.start, end: slp.end, label: 'Sleep'});
  const len = (item.end - item.start + 1440) % 1440;
  const segs = [];
  let cur = null;
  for(let t = 0; t < len; t++){
    const abs = (item.start + t) % 1440;
    let owner = null;
    for(const s of sources){
      const l = (s.end - s.start + 1440) % 1440;
      if((abs - s.start + 1440) % 1440 < l){ owner = s.label; break; }
    }
    if(owner){
      if(cur && cur.owner === owner && cur.to === abs){ cur.to = (abs + 1) % 1440; cur.mins++; }
      else { cur = {owner: owner, from: abs, to: (abs + 1) % 1440, mins: 1}; segs.push(cur); }
    } else cur = null;
  }
  return segs;
}

function cutSegments(item, extra, slp){
  const sources = [];
  for(const e of extra) if(e.start != null && e.end != null) sources.push({start: e.start, end: e.end, label: 'Other works: ' + e.name});
  for(const d of dl('d_distract')) if(d.start != null && d.end != null) sources.push({start: d.start, end: d.end, label: 'Distraction: ' + d.name});
  if(slp) sources.push({start: slp.start, end: slp.end, label: 'Sleep'});
  const len = (item.end - item.start + 1440) % 1440;
  const segs = [];
  let cur = null;
  for(let t = 0; t < len; t++){
    const abs = (item.start + t) % 1440;
    let owner = null;
    for(const s of sources){
      const l = (s.end - s.start + 1440) % 1440;
      if((abs - s.start + 1440) % 1440 < l){ owner = s.label; break; }
    }
    if(owner){
      if(cur && cur.owner === owner && cur.to === abs){ cur.to = (abs + 1) % 1440; cur.mins++; }
      else { cur = {owner: owner, from: abs, to: (abs + 1) % 1440, mins: 1}; segs.push(cur); }
    } else cur = null;
  }
  return segs;
}
function studyTimeBox(){
  const study = dl('d_time').filter(i => i.start != null && i.end != null);
  const extra = dl('d_extra').filter(i => i.start != null && i.end != null);
  const rec = (S.sleep || {})[keyFor('daily')];
  const slp = rec ? {start: rec.bed, end: rec.wake} : null;
  const fmt = n => Math.floor(n/60) + 'h ' + (n % 60) + 'm';
  let net = 0, cutAll = 0, planned = 0, rows = '';
  for(const it of study){
    const len = (it.end - it.start + 1440) % 1440;
    const segs = cutSegments(it, extra, slp);
    const cut = segs.reduce((a, s) => a + s.mins, 0);
    const free = freeSegs(it, segs);
    planned += len; net += len - cut; cutAll += cut;
    rows += `<div class='row'><span class='grow'>${esc(it.name)}</span><span class='tm'>${fmt12(it.start)} - ${fmt12(it.end)}</span><span style='margin-left:8px;font-weight:700'>${fmt(len)}</span></div>`;
    for(const s of segs) rows += `<div class='sub' style='padding:2px 4px 2px 14px;color:#ff4d4d'>&#9986; cut ${fmt12(s.from)} - ${fmt12(s.to)} &middot; ${esc(s.owner)} (${fmt(s.mins)})</div>`;
    const freeTxt = free.length ? free.map(f => `${fmt12(f.from)} - ${fmt12(f.to)} (${fmt(f.mins)})`).join(', ') : 'nothing left';

  const body = studyOpen ? ((rows || `<div class='sub'>Add start and end times in Time basis to see your study time.</div>`) + summary) : '';
  return `<div class='card glass' id='studyBox' style='padding:12px 14px'><div class='chead' style='cursor:pointer' onclick='toggleStudy()'><b>Study time</b><span class='sub'>${fmt(net)} total <span style='margin-left:6px'>${studyOpen ? '&#9650;' : '&#9660;'}</span></span></div>${body}</div>`;
}

    const w = rnd(180, 420).toFixed(0), left = rnd(-10, 100).toFixed(1);
    const dur = rnd(14, 26).toFixed(1), del = (-rnd(0, 20)).toFixed(1), op = rnd(.3, .6).toFixed(2);
    h += `<i class='mistb' style='left:${left}%;width:${w}px;height:${(w * 0.5).toFixed(0)}px;animation-duration:${dur}s;animation-delay:${del}s;opacity:${op}'></i>`;
  }
  return "<div class='fx' style='background:linear-gradient(160deg,#4a0008 0%,#7a0012 30%,#2e0005 65%,#140002 100%)'></div><div class='fx fx-mistb'>" + h + '</div>';
}
FX.red = "<div class='fx' style='background:linear-gradient(160deg,#4a0008 0%,#7a0012 30%,#2e0005 65%,#140002 100%)'></div><div class='fx fx-redglow'><div class='rglow'></div></div>";
function bloodHTML(){
  let d = '';
  for(let i = 0; i < 40; i++) d += `<i class='drop2' style='left:${rnd(0,100).toFixed(1)}%;width:${rnd(6,10).toFixed(0)}px;height:${rnd(34,56).toFixed(0)}px;animation-duration:${rnd(7,12).toFixed(1)}s;animation-delay:${(-rnd(0,12)).toFixed(1)}s'></i>`;
  return "<div class='fx' style='background:radial-gradient(circle at 20% 30%,#8a0010 0%,transparent 40%),radial-gradient(circle at 80% 70%,#5a0008 0%,transparent 45%),#1a0000'></div><div class='fx fx-glass'></div><div class='fx fx-blood'>" + d + '</div>';
}
FX.blood = psychoHTML();
function greenMistHTML(){
  let h = '';
  for(let i = 0; i < 14; i++){
    const w = rnd(180, 420).toFixed(0), left = rnd(-10, 100).toFixed(1);
    const dur = rnd(14, 26).toFixed(1), del = (-rnd(0, 20)).toFixed(1), op = rnd(.3, .6).toFixed(2);
    h += `<i class='mistb' style='left:${left}%;width:${w}px;height:${(w * 0.5).toFixed(0)}px;animation-duration:${dur}s;animation-delay:${del}s;opacity:${op}'></i>`;
  }
  return "<div class='fx fx-gob'><div class='glow'></div></div><div class='fx fx-mistb'>" + h + '</div>';
}
FX.green = "<div class='fx fx-gob'><div class='glow'></div></div>";

  const n = new Date();
  document.getElementById('clockTime').textContent = n.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', second:'2-digit', hour12:true});
  document.getElementById('clockDate').textContent = n.toLocaleDateString(undefined, {weekday:'long', year:'numeric', month:'long', day:'numeric'});
}

function toggleFull(){
  const el = document.documentElement;
  if(!document.fullscreenElement){
    (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
  }
}
renderMusic();
